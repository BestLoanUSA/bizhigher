<form class="tool-box" id="tool-form">
  <div class="tool-row">
    <div><label class="tool-label">업종</label><input class="input" name="bizType" required maxlength="80" placeholder="예: 한식당, 치과, 네일샵, 이사 업체"></div>
    <div><label class="tool-label">광고할 지역</label><input class="input" name="area" required maxlength="120" placeholder="예: Fort Lee NJ, Palisades Park"></div>
  </div>
  <label class="tool-label">대표 메뉴·서비스 (선택)</label>
  <input class="input" name="services" maxlength="400" placeholder="예: 갈비, 순두부, 점심 세트, 단체 예약">
  <div class="tool-row">
    <div><label class="tool-label">키워드 언어</label><select class="input" name="lang"><option value="both">한국어 + 영어</option><option value="en">영어만</option><option value="ko">한국어만</option></select></div>
    <div><label class="tool-label">가게 이름 (선택)</label><input class="input" name="bizName" maxlength="80"></div>
  </div>
  <button type="submit" class="btn btn-primary btn-block" data-busy="키워드 짜는 중… (최대 20초)">키워드·제외 키워드 만들기</button>
  <p class="tool-msg"></p>
  <p class="tool-fine">AI가 손님의 "지금 찾는" 검색어 위주로 키워드 그룹을 짜고, 돈만 새는 검색어를 제외 목록으로 골라 드립니다 · 검색량은 구글 키워드 플래너에서 확인하세요</p>
</form>
<div class="tool-result" id="tool-result" hidden></div>
