<form class="tool-box" id="tool-form">
  <label class="tool-label">한국어로 가게 소개 (편하게 쓰세요)</label>
  <textarea class="input" name="intro" rows="5" required maxlength="2000" placeholder="2005년부터 가든그로브에서 순두부를 끓여 온 가족 식당입니다. 매일 아침 직접 만든 두부를 쓰고..."></textarea>
  <div class="tool-row">
    <div><label class="tool-label">업종</label><input class="input" name="bizType" maxlength="60" placeholder="예: 한식당"></div>
    <div><label class="tool-label">지역</label><input class="input" name="city" maxlength="80" placeholder="예: Garden Grove CA"></div>
  </div>
  <label class="tool-label">가게 이름</label>
  <input class="input" name="bizName" maxlength="80">
  <button type="submit" class="btn btn-primary btn-block">한/영 소개문 만들기</button>
  <p class="tool-msg"></p>
  <p class="tool-fine">구글 비즈니스 프로필 설명 규격(750자, URL·가격·할인 문구 금지)에 맞춥니다 · 하루 15회까지 무료</p>
</form>
<div class="tool-result" id="tool-result" hidden></div>
