<form class="tool-box" id="tool-form">
  <label class="tool-label">업체명과 도시</label>
  <input class="input" name="query" placeholder="예: 청기와 순두부 Los Angeles" required maxlength="200">
  <button type="submit" class="btn btn-primary btn-block" data-busy="찾는 중…">내 가게 찾기</button>
  <p class="tool-msg"></p>
  <p class="tool-fine">구글 지도 데이터로 검색합니다</p>
</form>
<div class="tool-result" id="tool-result" hidden></div>
