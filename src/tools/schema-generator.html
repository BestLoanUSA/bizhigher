<form class="tool-box" id="tool-form">
  <div class="tool-row">
    <div><label class="tool-label">업종</label>
      <select class="input" name="type">
        <option value="Restaurant">식당</option><option value="CafeOrCoffeeShop">카페</option><option value="Bakery">베이커리·떡집</option>
        <option value="HairSalon">미용실</option><option value="NailSalon">네일샵</option><option value="BeautySalon">피부·뷰티샵</option>
        <option value="Dentist">치과</option><option value="MedicalClinic">한의원·병원</option><option value="Optician">안경점</option>
        <option value="RealEstateAgent">부동산</option><option value="FinancialService">융자·금융</option><option value="InsuranceAgency">보험</option>
        <option value="AccountingService">세무·회계</option><option value="LegalService">법률 사무소</option><option value="AutoRepair">자동차 정비</option>
        <option value="GroceryStore">마트·식품점</option><option value="Store">상점·매장</option><option value="LocalBusiness">학원·기타 업종</option>
      </select></div>
    <div><label class="tool-label">가격대</label>
      <select class="input" name="priceRange"><option value="">선택 안 함</option><option>$</option><option selected>$$</option><option>$$$</option><option>$$$$</option></select></div>
  </div>
  <div class="tool-row">
    <div><label class="tool-label">상호 (간판 영문 표기)</label><input class="input" name="name" required maxlength="120" placeholder="예: Seoul Garden"></div>
    <div><label class="tool-label">한글 상호 (선택)</label><input class="input" name="altName" maxlength="120" placeholder="예: 서울가든"></div>
  </div>
  <div class="tool-row">
    <div><label class="tool-label">웹사이트 주소</label><input class="input" name="url" maxlength="300" placeholder="https://seoulgarden.com"></div>
    <div><label class="tool-label">전화번호</label><input class="input" name="bizPhone" maxlength="40" placeholder="(770) 555-0123"></div>
  </div>
  <label class="tool-label">주소</label>
  <input class="input" name="street" required maxlength="200" placeholder="도로명 주소 (예: 3480 Steve Reynolds Blvd, Suite 101)">
  <div class="tool-row tool-row-3">
    <div><input class="input" name="city" required maxlength="80" placeholder="도시 (Duluth)"></div>
    <div><input class="input" name="state" required maxlength="2" placeholder="주 (GA)"></div>
    <div><input class="input" name="zip" required maxlength="10" placeholder="우편번호 (30096)"></div>
  </div>
  <label class="tool-label">영업시간 <button type="button" class="btn btn-ghost btn-small sg-copy-hours">월요일 시간을 평일에 복사</button></label>
  <div class="sg-hours" id="sg-hours"></div>
  <label class="tool-label">대표 사진 주소 (선택)</label>
  <input class="input" name="image" maxlength="400" placeholder="https://seoulgarden.com/images/storefront.jpg">
  <label class="tool-label">가게 소개 한두 문장 (선택)</label>
  <textarea class="input" name="description" rows="2" maxlength="500" placeholder="Family-run Korean BBQ in Duluth since 2008."></textarea>
  <div class="sg-food" id="sg-food">
    <div class="tool-row">
      <div><label class="tool-label">음식 종류</label><input class="input" name="cuisine" maxlength="80" value="Korean"></div>
      <div><label class="tool-label">메뉴 페이지 주소 (선택)</label><input class="input" name="menu" maxlength="300" placeholder="https://seoulgarden.com/menu"></div>
    </div>
    <label class="tool-label">예약</label>
    <select class="input" name="reservations"><option value="">선택 안 함</option><option value="true">예약 받음</option><option value="false">예약 안 받음</option></select>
  </div>
  <label class="tool-label">SNS·다른 등록처 주소 (한 줄에 하나, 선택)</label>
  <textarea class="input" name="sameAs" rows="3" maxlength="2000" placeholder="https://www.instagram.com/seoulgarden&#10;https://www.yelp.com/biz/seoul-garden-duluth"></textarea>
  <button type="submit" class="btn btn-primary btn-block">스키마 코드 만들기</button>
  <p class="tool-msg"></p>
  <p class="tool-fine">만든 코드를 웹사이트 첫 페이지에 붙이면 구글·AI 검색이 가게 이름·주소·전화·영업시간을 정확한 "업소 정보"로 읽습니다 · 코드는 이 브라우저에서만 만들어집니다</p>
</form>
<div class="tool-result" id="tool-result" hidden></div>
