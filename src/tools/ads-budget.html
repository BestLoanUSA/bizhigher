<form class="tool-box" id="tool-form">
  <div class="tool-row">
    <div><label class="tool-label">한 달 목표 새 손님 수</label><input class="input" name="customers" type="number" min="1" value="30" required></div>
    <div><label class="tool-label">손님 1명 평균 결제액 ($)</label><input class="input" name="ticket" type="number" min="1" step="0.01" value="60" required></div>
  </div>
  <div class="tool-row">
    <div><label class="tool-label">예상 클릭당 비용 CPC ($)</label><input class="input" name="cpc" type="number" min="0.1" step="0.01" value="2.5" required></div>
    <div><label class="tool-label">클릭 → 손님 전환율 (%)</label><input class="input" name="cvr" type="number" min="0.1" max="100" step="0.1" value="5" required></div>
  </div>
  <div class="tool-row">
    <div><label class="tool-label">마진율 (%)</label><input class="input" name="margin" type="number" min="1" max="100" value="30" required></div>
    <div><label class="tool-label">손님 1명 재방문 횟수 (1년)</label><input class="input" name="repeat" type="number" min="1" step="0.5" value="1"></div>
  </div>
  <button type="submit" class="btn btn-primary btn-block">계산하기</button>
  <p class="tool-msg"></p>
  <p class="tool-fine">CPC·전환율 기본값은 예시입니다. 내 업종·지역의 실제 CPC는 구글 키워드 플래너에서 확인하세요 · 계산은 이 브라우저에서만 이뤄집니다</p>
</form>
<div class="tool-result" id="tool-result" hidden></div>
