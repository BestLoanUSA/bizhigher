# 키워드 묶음 → 주인 URL 하나 (seo/README.md 규칙 — 한 키워드에 한 페이지).
#
# 모양이 고정된 파일이다 — scripts/seo-check.js 가 패턴으로 읽는다(YAML 라이브러리 없음).
#   - id       묶음 이름 (site- svc- pkg- tool- hub- post- data-)
#     keywords [한 줄 배열] — 이 묶음으로 순위를 노리는 검색어(한국어·영어). 제목·H1·설명문이 이 말을 쓴다
#     intent   brand | transactional | tool | informational | data
#     owner    이 묶음의 주인 페이지 하나(끝에 /). 한 URL 이 두 묶음의 owner 면 seo:check 가 막는다
#     support  같은 주제의 보조 페이지 — 다른 각도로 쓰고 owner 로 링크한다. support 제목이 owner 키워드를 정면으로 노리면 잠식
#     note     전략 루틴의 메모(실제 검색어·충돌·판단)
#
# 0단계 초안(2026-11-02): keywords 는 각 원고의 front matter keywords·서비스명·도구명에서 자동으로 뽑은 가설이다.
# Search Console 데이터(seo-data metrics/bizhigher/)가 쌓이면 전략 루틴이 실제 검색어로 고친다. 2026-11-01 기준 노출된 검색어 15개뿐.
# 잠식 의심: 구글 비즈니스 프로필(서비스 google-profile-optimization vs 블로그 허브·가이드), 리뷰(서비스 review-reply·review-qr-kit vs 도구 review-link·블로그) —
#   서비스 = 구매 의도, 블로그 = 정보 의도, 도구 = 직접 해 보기 로 각도를 나눈다. 제목에 같은 말을 쓰더라도 의도가 다르면 잠식이 아니다.

