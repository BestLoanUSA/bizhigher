    keywords: [비즈하이어, bizhigher, 한인 비즈니스 AI 광고회사, 한인 마케팅 대행, 미주 한인 마케팅 회사]
    intent: brand
    owner: /
    support: [/services/, /pricing/]
    note: 브랜드 검색. H1 은 가격 우위 문구(CLAUDE.md §1)

  - id: pricing
