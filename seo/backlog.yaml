  - id: K-02
    title: keyword-map 초안 정리 — 서비스·도구·허브·글이 같은 키워드를 쓰는 25곳의 각도 나누기
    source: 2026-11-02 (seo-check 보고서 "두 묶음에 같은 키워드" 25, "owner 제목·H1 에 키워드 없음" 26)
    status: ready
    path: structure
    target: [seo/keyword-map.yaml]
    notes: >
      keyword-map.yaml 만 고치는 PR. 규칙: 같은 말이라도 서비스 = 구매(…대행, …비용), 도구 = 직접(…만들기, …체크), 블로그 = 정보(…하는 법, …이유)로
      키워드를 다시 적는다. 허브와 스포크가 같은 키워드면 스포크가 주인(허브는 지도 역할). 예: "구글 리뷰 링크 만들기" → tool-review-link 만,
      svc-review-qr-kit 는 "리뷰 QR 키트 제작·테이블텐트". owner 제목에 키워드가 없는 26곳은 키워드를 제목 쪽에 맞추거나(정보 글) 제목을 바꿀 O- 항목으로.

