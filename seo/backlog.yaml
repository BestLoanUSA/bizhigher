      ③ 머지 후 Actions 에서 indexnow.yml 을 수동 실행(workflow_dispatch = 사이트맵 전체 전송). 성공 지표: 2주 뒤 index-latest 에서
      unknown 0, discovered 3 이하.
      2026-11-02 claude/beautiful-meitner-9lwsho: 서비스·도구 가이드에 문맥 링크 3개(nap-check→local-listing-care, google-profile-optimization→local-listing-care,
      review-qr-kit→tools/review-calc), upgrade-queue 맨 위에 블로그 2편(korean-business-directory-list·google-business-profile-hours-update → local-listing-care).
