    title: 구글이 모르는 URL 6개 + 발견만 된 5개 — 내부 링크 보강과 IndexNow 재전송
    source: 2026-11-02 (index-latest.md 2026-11-01 — 사이트맵 84 중 색인 68, "URL is unknown to Google" 6, "Discovered - currently not indexed" 5)
    status: in-progress
    path: structure
    target: [/service/local-listing-care/, /service/local-listing-setup/, /service/shortform-video/, /blog/google-ads-vs-meta-ads-for-local-business/, /blog/google-business-profile-services-guide/, /blog/yelp-management-guide/, /blog/do-you-need-a-website/, /blog/google-business-profile-category-guide/, /blog/google-business-profile-hours-update/, /blog/small-business-blog-topic-ideas/, /tools/review-calc/]
    notes: >
      서비스 3개는 /services/ 와 푸터에 이미 링크돼 있는데도 구글이 모른다 — 사이트맵 lastmod 가 블로그에만 붙는 정책(§10-2)이라
      새 서비스 페이지는 발견이 느리다. 할 것: ① 관련 블로그 글 본문·허브에서 이 서비스 3개로 가는 문맥 링크(로컬 등록 → 디렉토리 글,
