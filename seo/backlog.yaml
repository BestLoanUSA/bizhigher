  - id: K-01
    title: /tools/local-rank/ — "구글 지도 순위 체크" 검색어 48~74위에서 1페이지로
    source: 2026-11-02 (latest.md 2026-11-01 — 노출 상위 검색어 "구글순위체크" 9, "구글 지도 순위 체크" 6, "구글지도순위체크" 4, "구글 지도 순위 조회" 1; tools 섹션이 전체 노출 35/64)
    status: done
    path: structure
    target: [content/tools/local-rank.md, /tools/local-rank/]
    notes: >
      사이트에서 유일하게 검색 수요가 보이는 페이지. 제목·H1 은 이미 "구글 지도 순위 체크". 부족한 것은 깊이 — content/tools/local-rank.md 의
      가이드 섹션을 질문형 ##(순위가 왜 위치마다 다른가 · 격자 7×7 의 뜻 · 몇 위면 손님이 오나 · 올리는 법 4가지)으로 보강하고 FAQ 를 5개로.
      "다음맵순위체크"(2) 같은 한국 서비스 검색어는 우리 대상이 아니다 — 첫 문단에 "미국 구글 지도" 를 명시해 걸러낸다.
      /blog/near-me-search-ranking/ 과 /blog/not-showing-on-google/ 본문에서 이 도구로 가는 링크 추가(지금은 하단 추천 블록만).
      성공 지표: 4주 뒤 "구글 지도 순위 체크" 류 평균 순위 30 이하, 클릭 1 이상.
      2026-11-03 claude/beautiful-meitner-zyudi1: content/tools/local-rank.md 에 "미국 구글 지도" 도입 문단·질문형 ## 3개(격자 뜻·몇 위면 손님이 오나·올리는 법 4가지)·FAQ 5개. 블로그 2편 링크는 글을 직접 쓰지 않는 규칙에 따라 upgrade-queue 맨 위에 넣음.
      2026-11-09 머지 확인(11-03). 11-08 "구글 지도 순위 체크" 평균 58위(전 64위권), 클릭 0. 4주 판정은 12-01 이후.

  - id: O-01
    title: 블로그 <title> 태그를 짧게 — 56페이지가 표시 폭 60 초과
    source: 2026-11-02 (seo-check 보고서 — 제목 폭 60 초과 56/84, 최대 106; 블로그는 "{제목} | BizHigher 블로그" 라 전부 초과)
    status: ready
    path: structure
    target: [build.js, content/blog/*.md]
    notes: >
      H1(글 제목)은 그대로 두고 <title> 만 줄인다. build.js 블로그 페이지가 front matter `seo_title` 이 있으면 <title> 에 그것을 쓰도록
      (없으면 지금처럼 title). 접미는 " | BizHigher" 로 통일(블로그 를 떼면 폭 -6). 1차로 노출이 있는 글 7편과 허브 6편에
      seo_title(폭 50 이하, 묶음 keywords 의 첫 검색어 포함)을 넣는다 — 나머지는 upgrade-queue 루틴이 글을 손볼 때 채운다(규칙을 blog-calendar 스타일 가이드에 한 줄).
      seo-check 는 그대로 보고만 한다(막지 않음). 성공 지표: 4주 뒤 블로그 섹션 CTR 과 노출.

