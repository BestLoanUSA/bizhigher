name: OG 이미지 생성

# 블로그 글이나 리포트가 추가되면 공유용 카드를 만들어 커밋한다.
# 커밋 대상(src/og, dist)이 트리거 경로에 없으므로 무한 루프는 생기지 않는다.
on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'data/reports/**'
      - 'data/surveys/**'
      - 'scripts/og.js'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 있는 이미지도 다시 만들기'
        type: boolean
        default: false

concurrency:
  group: og-images
  cancel-in-progress: false

jobs:
  og:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # rsvg-convert 가 SVG를 굽고, Noto Sans CJK 가 한글을 그린다
      - name: 렌더러와 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk

      - name: SVG 생성
        run: node scripts/og.js ${{ inputs.force && '--force' || '' }}

      - name: PNG로 굽기
        run: |
          shopt -s nullglob
          for f in src/og/*.svg; do
            out="${f%.svg}.png"
            rsvg-convert -w 1200 -h 630 "$f" -o "$out"
            echo "  ✓ $out"
            rm "$f"   # PNG만 저장소에 남긴다
          done

      - name: 사이트 다시 빌드
        run: node build.js

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/og dist
          if git diff --cached --quiet; then
            echo "바뀐 게 없다."
          else
            git commit -m "OG 이미지 생성 및 사이트 재빌드"
            git push
          fi
