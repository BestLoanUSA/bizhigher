name: SEO 점검

# 빌드한 dist/ 와 블로그 원고를 scripts/seo-check.js 규칙으로 검사한다(seo/README.md).
# PR 에서 빨간 체크 = 머지 전에 고칠 것. main 에서 실패하면(블로그 루틴이 직접 push 한 경우) 이슈를 하나 열어 둔다.
# 규칙은 스크립트 머리말, 알려진 예외는 seo/check-baseline.json.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'automation/**'
      - 'functions/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: seo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 빌드
        run: node build.js

      - name: SEO 점검
        id: seo
        run: node scripts/seo-check.js --report seo-report.md 2>&1 | tee seo-check.log; exit ${PIPESTATUS[0]}

      - name: 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            seo-report.md
            seo-check.log
          retention-days: 14

      # main 이 빨개지면(블로그 루틴의 직접 push 등) 이슈로 남긴다 — 같은 제목의 열린 이슈가 있으면 거기에 댓글만.
      - name: main 실패 이슈
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="SEO 점검 실패 — main"
          body=$(printf '`scripts/seo-check.js` 가 main 에서 실패했습니다 (%s).\n\n```\n%s\n```\n\n고치는 PR 을 올리거나, 의도된 예외면 `seo/check-baseline.json` 에 넣어 주세요(SEO 실행 루틴이 다음 실행에서 처리합니다).' "$RUN_URL" "$(head -60 seo-check.log)")
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body" --label seo || gh issue create --title "$title" --body "$body"; fi
